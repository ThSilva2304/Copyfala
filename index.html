 window.scrollTo(0,document.body.scrollHeight);
}
function setLv(l){S.lv[S.lang]=l;save();L=null;G=null;PT=null;draw()}
function place(){
 var n=LNM[S.lang];
 if(!PT){V.innerHTML='<div class="card"><b>Quanto você já sabe de '+n+'?</b><p class="pt">Assim as lições começam no ponto certo.</p>'+[['i','🌱 Iniciante','Começando do zero'],['m','🌿 Intermediário','Entendo frases simples'],['a','🌳 Avançado','Converso e quero fluência']].map(function(x){return '<button class="topic" data-l="'+x[0]+'"><span>'+x[1]+'</span><small>'+x[2]+'</small></button>'}).join('')+'<button class="alt" id="ts" style="width:100%">🧪 Não sei: fazer mini teste</button></div>';
  V.querySelectorAll('.topic').forEach(function(b){b.onclick=function(){setLv(b.dataset.l)}});document.getElementById('ts').onclick=function(){PT={n:0,s:0};place()};return}
 if(PT.n>=5){var l=PT.s<=1?'i':PT.s<=3?'m':'a';V.innerHTML='<div class="card"><div class="capy">🎯</div><p class="en" style="text-align:center">Você acertou '+PT.s+'/5</p><p class="pt" style="text-align:center">Seu nível: '+LN[l]+'</p><button id="b">Começar</button></div>';document.getElementById('b').onclick=function(){setLv(l)};return}
 var q=PQ[S.lang][PT.n];
 V.innerHTML='<div class="card"><small>Pergunta '+(PT.n+1)+'/5 · Qual é a tradução?</small><p class="en">'+q[0]+'</p>'+shuffle(q.slice(1)).map(function(o){return '<button class="opt" data-o="'+o+'">'+o+'</button>'}).join('')+'<button class="alt" id="sk" style="width:100%">Pular teste</button></div>';
 V.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){if(b.dataset.o===q[1])PT.s++;PT.n++;place()}});
 document.getElementById('sk').onclick=function(){PT=null;place()};
}
function draw(){nav();head();lang();if(!S.lv[S.lang]){place();return}if(tab==='learn')learn();else if(tab==='game')game();else if(tab==='prof')prof();else capy()}
function k(w){return w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9']/g,'')}
function words(s){return s.split(/\s+/).filter(Boolean)}
var NUM={en:['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'],es:['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce']};
NUM.fr=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze'];NUM.it=['zero','uno','due','tre','quattro','cinque','sei','sette','otto','nove','dieci','undici','dodici'];
function expand(s){s=s.toLowerCase().replace(/[’‘]/g,"'").replace(/can't/g,'cannot').replace(/won't/g,'will not').replace(/let's/g,'let us').replace(/n't/g,' not').replace(/\bi'm\b/g,'i am').replace(/'ll/g,' will').replace(/'re/g,' are').replace(/'ve/g,' have').replace(/\b(it|he|she|that|what|there)'s\b/g,'$1 is').replace(/\bcan not\b/g,'cannot');return s.replace(/\b\d+\b/g,function(m){return NUM[S.lang][+m]||m})}
function say(t, rt) {
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    u.lang = LC[S.lang];
    u.rate = rt || .9;
    
    var voices = speechSynthesis.getVoices();
    var preferredVoice = voices.find(function(v) {
      return v.lang === LC[S.lang] && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Neural') || v.name.includes('Enhanced'));
    });
    
    if (preferredVoice) {
      u.voice = preferredVoice;
    }
    
    speechSynthesis.speak(u);
  } catch (e) {}
}

if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = function() {
    speechSynthesis.getVoices();
  };
}
function learn(){
 if(!L){V.innerHTML='<div class="card"><b>Escolha um tema</b> <small>'+LN[S.lv[S.lang]]+' · '+TL().filter(function(x,i){return S.done[S.lang+S.lv[S.lang]+i]}).length+'/'+TL().length+' concluídos</small><p class="pt">Ouça, repita em voz alta e veja o que acertou palavra por palavra.</p>'+TL().map(function(l,i){return '<button class="topic" data-i="'+i+'"><span>'+(S.done[S.lang+S.lv[S.lang]+i]?'✅ ':'')+l.t+'</span><small>'+l.p.length+' frases</small></button>'}).join('')+'</div>';
  V.querySelectorAll('.topic').forEach(function(b){b.onclick=function(){L={i:+b.dataset.i,n:0,done:false};learn()}});return}
 var les=TL()[L.i];
 if(L.n>=les.p.length){S.done[S.lang+S.lv[S.lang]+L.i]=1;save();var nx=TL()[L.i+1];V.innerHTML='<div class="card"><div class="capy">🎉</div><p class="en" style="text-align:center">Tema completo!</p>'+(nx?'<button id="nx2" style="width:100%;margin-bottom:10px">Próximo: '+nx.t+' ➜</button>':'<p class="pt" style="text-align:center">Você concluiu todos os temas deste nível!</p>'+(S.lv[S.lang]!=='a'?'<button id="up" style="width:100%;margin-bottom:10px">Subir de nível ⬆️</button>':''))+'<button class="alt" id="b" style="width:100%">Voltar aos temas</button></div>';document.getElementById('b').onclick=function(){L=null;learn()};var n2=document.getElementById('nx2');if(n2)n2.onclick=function(){L={i:L.i+1,n:0};learn();window.scrollTo(0,0)};var up=document.getElementById('up');if(up)up.onclick=function(){setLv(S.lv[S.lang]==='i'?'m':'a')};return}
 var p=les.p[L.n],hasR=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
 V.innerHTML='<div class="card"><small>'+les.t+' · '+(L.n+1)+'/'+les.p.length+'</small><p class="en">'+p[0]+'</p><p class="pt">'+p[1]+'</p><div class="row"><button class="alt" id="ou">🔊 Ouvir</button>'+(hasR?'<button id="fa">🎤 Falar</button>':'')+'</div><input type="text" id="tx" placeholder="'+(hasR?'Ou digite o que você disse':'Seu navegador não ouve voz: digite a frase')+'" autocomplete="off"><button class="alt" id="vf" style="width:100%;margin-top:10px">Verificar</button><div id="rs" aria-live="polite" style="margin-top:14px"></div></div>';
 document.getElementById('ou').onclick=function(){say(p[0])};
 function check(said){var tw=words(p[0]),sw=words(expand(said)).map(k),hit=0;
  var h=tw.map(function(w){var ok=sw.indexOf(k(w))>-1;if(ok)hit++;return '<span class="w '+(ok?'ok':'no')+'">'+w.replace(/[¿?¡!.,]/g,'')+'</span>'}).join('');
  var pct=Math.round(hit/tw.length*100),pass=pct>=70;
  document.getElementById('rs').innerHTML=h+'<p>'+(pass?'Muito bem! '+pct+'% ✅':'Quase lá: '+pct+'%. Tente de novo.')+'</p>'+(pass?'<button id="nx">Próxima (+10 🪙)</button>':'');
  if(pass)document.getElementById('nx').onclick=function(){reward(10);L.n++;learn()}}
 var fa=document.getElementById('fa');
 if(fa)fa.onclick=function(){var R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang=LC[S.lang];r.interimResults=false;fa.textContent='👂 Ouvindo...';fa.disabled=true;
  r.onresult=function(e){var t=e.results[0][0].transcript;document.getElementById('tx').value=t;check(t)};
  r.onerror=function(e){document.getElementById('rs').textContent=(e&&e.error==='not-allowed')?'Microfone bloqueado: permita o acesso ou digite a frase.':'Não consegui ouvir. Tente de novo ou digite a frase.'};
  r.onend=function(){fa.textContent='🎤 Falar';fa.disabled=false};try{r.start()}catch(e){fa.disabled=false;fa.textContent='🎤 Falar'}};
 document.getElementById('vf').onclick=function(){check(document.getElementById('tx').value)};
 document.getElementById('tx').onkeydown=function(e){if(e.key==='Enter')check(this.value)};
}
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}
function WLv(){if(FW[S.lang])return FW[S.lang][S.lv[S.lang]].split(';').map(function(s){var a=s.split('|');return [a[1],a[0]]});var l=S.lv[S.lang],b=(l==='i'?WORDS[S.lang]:EW[S.lang][l]).slice(),ix=S.lang==='en'?1:2,seen={},out=[];CW[l].split(';').forEach(function(s){var a=s.split('|');if(a[ix])b.push([a[ix],a[0]])});b.forEach(function(w){if(!seen[w[0]]&&!seen['p'+w[1]]){seen[w[0]]=1;seen['p'+w[1]]=1;out.push(w)}});return out}
function game(){
 if(!G){G={pos:0,lives:3,q:null,res:null,over:false}}
 if(G.over){var w=G.pos>=6;V.innerHTML='<div class="card"><div class="capy">'+(w?'🏆':'🚗')+'</div><p class="en" style="text-align:center">'+(w?'Você atravessou! +25 🪙':'Atropelado pelo trânsito!')+'</p><button id="b">Jogar de novo</button></div>';document.getElementById('b').onclick=function(){G=null;game()};return}
 if(!G.q){var WL=WLv();if(!G.deck||!G.deck.length)G.deck=shuffle(WL.slice());var c=G.deck.pop(),wrong=shuffle(WL.filter(function(x){return x[1]!==c[1]})).slice(0,2).map(function(x){return x[1]});G.q={w:c[0],a:c[1],o:shuffle([c[1]].concat(wrong))}}
 var t='';for(var i=0;i<6;i++)t+='<div class="lane '+(i<G.pos?'done':'')+(i===G.pos?' on':'')+'">'+(i===G.pos?'🐹':i<G.pos?'✔':'🚗')+'</div>';
 V.innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><small>Vidas: '+'❤️'.repeat(G.lives)+'</small><small>Faixa '+(G.pos+1)+'/6</small></div><div class="track">'+t+'</div><small>Qual é a tradução de</small><p class="en">'+G.q.w+' <button class="alt" id="sp" style="padding:4px 10px;flex:none">🔊</button></p><div id="op">'+G.q.o.map(function(o){return '<button class="opt" data-o="'+o+'">'+o+'</button>'}).join('')+'</div></div>';
 document.getElementById('sp').onclick=function(){say(G.q.w)};
 V.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var g=G,ok=b.dataset.o===G.q.a;V.querySelectorAll('.opt').forEach(function(x){x.disabled=true;if(x.dataset.o===G.q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');
  setTimeout(function(){if(tab!=='game'||G!==g)return;if(ok){G.pos++;reward(2);if(G.pos>=6){G.over=true;reward(25)}}else{G.lives--;if(G.lives<=0)G.over=true}G.q=null;game()},700)}});
}
function capy(){
 V.innerHTML='<div class="card"><div class="capy">'+(S.hat?'<span class="hat">'+S.hat+'</span>':'')+'🐹</div><p class="pt" style="text-align:center">'+(S.streak?'Capy notou que você voltou. Sequência de '+S.streak+' dia(s)!':'Faça uma lição para começar sua sequência.')+'</p></div><div class="card"><b>Loja de chapéus</b><div class="row" style="margin-top:10px">'+HATS.map(function(h){var o=S.owned.indexOf(h[0])>-1;return '<button class="'+(S.hat===h[0]?'':'alt')+'" data-h="'+h[0]+'" style="flex:1 1 40%">'+h[0]+' '+(o?(S.hat===h[0]?'Usando':'Usar'):h[1]+' 🪙')+'</button>'}).join('')+'</div>'+(S.hat?'<button class="alt" id="rm" style="width:100%;margin-top:10px">Tirar chapéu</button>':'')+'</div><div class="card"><b>Seu nível</b> '+LN[S.lv[S.lang]]+'<button class="alt" id="mv" style="width:100%;margin-top:10px">Mudar nível</button></div><div class="card"><small>A voz usa o reconhecimento de voz do navegador (melhor no Chrome).</small></div>';
 V.querySelectorAll('[data-h]').forEach(function(b){b.onclick=function(){var h=b.dataset.h,p=HATS.filter(function(x){return x[0]===h})[0][1];if(S.owned.indexOf(h)<0){if(S.coins<p){b.textContent='Faltam '+(p-S.coins)+' 🪙';return}S.coins-=p;S.owned.push(h)}S.hat=h;save();draw()}});
 document.getElementById('mv').onclick=function(){S.lv[S.lang]='';save();draw()};var rm=document.getElementById('rm');if(rm)rm.onclick=function(){S.hat='';save();draw()};
}
draw();
